name: CI — Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # conftest.py stubs out torch, transformers, scispaCy models, fitz,
      # openai, instructor, gliner — so CI never downloads heavy NLP models.
      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pyyaml requests biopython beautifulsoup4 pymupdf tiktoken \
            pydantic "instructor==0.4.8" "spacy==3.7.5" scispacy \
            python-dotenv rich fastapi uvicorn httpx openai \
            python-multipart websockets pytest pytest-cov

      - name: Run tests
        env:
          OPENAI_API_KEY: "ci-stub-key"
          PUBMED_API_KEY: "ci-stub-key"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pytest tests/ -v --tb=short \
            --cov=src --cov=api \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
